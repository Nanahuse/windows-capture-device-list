name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Clean-install wheel into fresh venv
        run: |
          uv venv .verify-venv
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv pip install --python .verify-venv $wheel
          uv pip install --python .verify-venv pytest
      - name: Smoke test installed wheel
        run: |
          Push-Location .verify-venv
          Scripts/python -c "import windows_capture_device_list as m; assert 'site-packages' in m.__file__, m.__file__"
          Pop-Location
          .verify-venv/Scripts/pytest test
