[build-system]
requires = ["setuptools", "pybind11", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-capture-device-list"
version = "0.1.0"
description = "A Python package to list Windows capture devices using DirectShow."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pybind11>=3.0.1",
    "pybind11-stubgen>=2.5.5",
    "pytest>=9.0.1",
    "ruff>=0.16.2",
    "setuptools>=80.9.0",
    "ty>=0.0.71",
]

[tool.ruff]
extend-exclude = ["windows_capture_device_list/core.pyi"]

[tool.ruff.format]
exclude = ["windows_capture_device_list/core.pyi"]
