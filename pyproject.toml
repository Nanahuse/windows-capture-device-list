[build-system]
requires = ["setuptools", "pybind11", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-capture-device-list"
version = "0.2.0"
description = "A Python package to list Windows capture devices using DirectShow."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pybind11>=3.0.1",
    "pybind11-stubgen>=2.5.5",
    "pytest>=9.0.1",
    "setuptools>=80.9.0",
]
